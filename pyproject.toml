# One file for the project's Python settings: what it is, what it needs, and how the
# checking tools (ruff, mypy, pytest, coverage) behave. `uv sync` reads it and builds .venv/.

[project]
name = "scam-mule-defense-lab"
version = "0.0.0"
description = "A simulated US bank defended against scam payments, money mules and money laundering."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martins Ogiekpolor" }]
# 3.12 everywhere (PC, CI, VM containers) so the same code and the same lockfile work in all places.
requires-python = ">=3.12,<3.13"
# No runtime libraries yet. Each phase adds only what it uses.
dependencies = []

[dependency-groups]
# Tools for checking the code. Installed by `uv sync`, never shipped.
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The importable packages (see the "Repository layout" in the README).
packages = [
    "common",
    "scamsim",
    "intel",
    "features",
    "models",
    "serving",
    "streaming",
    "casemgmt",
]

# --- ruff: style and bug checks, plus the code formatter --------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: basic style
    "F",       # pyflakes: unused names, undefined names
    "I",       # import order
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern Python syntax
    "SIM",     # simplifications
    "S",       # bandit: security smells (hard-coded passwords, unsafe calls)
    "PT",      # pytest style
    "RUF",     # ruff's own checks
]

[tool.ruff.lint.per-file-ignores]
# Tests use plain `assert` on purpose.
"**/tests/**" = ["S101"]

# --- mypy: type checks ------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["common", "scamsim", "intel", "features", "models", "serving", "streaming", "casemgmt"]

# --- pytest and coverage ----------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = [
    "common",
    "scamsim",
    "intel",
    "features",
    "models",
    "serving",
    "streaming",
    "casemgmt",
]

[tool.coverage.run]
branch = true
# Only the folders with a coverage target are measured.
source = ["common", "scamsim", "features", "models/policy", "serving"]
omit = ["**/tests/**"]

[tool.coverage.report]
# CLAUDE.md: at least 80% for scamsim/, features/, models/policy/ and serving/ (plus common/).
# CI runs this gate on exactly those folders; see .github/workflows/ci.yml.
fail_under = 80
show_missing = true
skip_empty = true
