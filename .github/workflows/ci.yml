# CI: the automatic checks GitHub runs on every pull request, and on main after a merge.
# Nothing here deploys anything or uses any secret. The stack job makes up throwaway passwords.
#
# Required checks on main (branch protection): lint, types, test, secrets,
# stack (linux/amd64), stack (linux/arm64). They are matched by job name.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI may only read the repository; it can't push, comment or change settings.
permissions:
  contents: read

# A newer run on the same branch cancels the older one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  SCAM_MULE_ENV: ci

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # exact version: setup-uv has no short v10 tag
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: Other pre-commit checks (whitespace, YAML, large files, private keys)
        # gitleaks has its own job below; mypy has the types job.
        run: SKIP=gitleaks-docker,mypy,ruff-check,ruff-format uv run pre-commit run --all-files --show-diff-on-failure

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # exact version: setup-uv has no short v10 tag
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: mypy (strict)
        run: uv run mypy   # which folders: [tool.mypy] in pyproject.toml

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # exact version: setup-uv has no short v10 tag
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: pytest with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: "Coverage gate: each of common, scamsim, intel, features, models/policy, serving >= 80%"
        # One gate per folder, so a well-tested folder can't hide an untested one.
        # A folder with no code yet (Phase 0) is reported and skipped.
        run: |
          for d in common scamsim intel features models/policy serving; do
            if out=$(uv run coverage report --include="$d/*" --fail-under=80 2>&1); then
              echo "$d: $(echo "$out" | tail -1)"
            elif echo "$out" | grep -q "No data to report"; then
              echo "$d: no code yet"
            else
              echo "$out"; echo "::error::$d is below 80% coverage"; exit 1
            fi
          done

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history, not just the latest commit
      - name: gitleaks, every commit in the history
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0
          git /repo --redact --verbose --exit-code 1
      - name: gitleaks, the files as they are in this commit
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0
          dir /repo --redact --verbose --exit-code 1

  stack:
    # Starts the PROD compose file and fails unless all three services become healthy and answer
    # a real request. Runs on Intel AND on Arm, because the Oracle VM is an Arm machine.
    name: stack (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64   # the Oracle Cloud Arm VM
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      COMPOSE_PROJECT_NAME: scam-mule-ci
    steps:
      - uses: actions/checkout@v7
      - name: Make throwaway passwords for this run only
        run: |
          for name in POSTGRES_PASSWORD REDIS_PASSWORD; do
            value=$(openssl rand -hex 16)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start the stack and wait until every service is healthy
        # Kafka (a Java program) takes the longest; about a minute on a PC.
        run: docker compose up -d --wait --wait-timeout 240
      - name: Show the services (each should say "healthy")
        run: docker compose ps
      - name: Kafka stores a message and hands it back
        # Kafka's tools are Java programs too: give them a small heap of their own, or each one
        # inherits the broker's 512 MB inside the same 1.5 GB container.
        run: |
          kafka="docker compose exec -T -e KAFKA_HEAP_OPTS=-Xmx128m kafka /opt/kafka/bin"
          $kafka/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --topic ci.smoke --partitions 1 --replication-factor 1
          echo "hello" | $kafka/kafka-console-producer.sh --bootstrap-server localhost:9092 --topic ci.smoke
          got=$($kafka/kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic ci.smoke \
            --from-beginning --max-messages 1 --timeout-ms 60000)
          echo "received: $got"
          test "$got" = "hello"
      - name: Redis and PostgreSQL answer a real request
        run: |
          docker compose exec -T redis redis-cli set ci:smoke ok
          test "$(docker compose exec -T redis redis-cli get ci:smoke)" = "ok"
          docker compose exec -T postgres psql -U scam_mule -d scam_mule -c "select version();"
      - name: Memory use stays under the caps
        run: docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}"
      - name: Logs (only if something failed)
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove the stack and its data
        if: always()
        run: docker compose down -v
