# Scam & Mule Defense Lab: the data services (Apache Kafka, Redis, PostgreSQL).
#
# THIS FILE IS PROD: the always-on demo on the Oracle VM, which is SHARED WITH BANK HEALTH.
# The PC (dev) adds docker-compose.dev.yaml on top: its own project name, containers, volumes
# and database, so dev data never mixes with prod. Same pattern as bank-health-data-platform.
#
# Memory and CPU limits come from docs/adr/0004-oracle-vm-memory-budget.md. Together the three
# services can never use more than 3 GB of RAM or 2.5 CPU cores, and they never use swap.
# If memory runs short, the kernel stops these containers BEFORE Bank Health's (oom_score_adj).
#
# Start (and wait until every service is healthy):  docker compose up -d --wait
# Check:                                            docker compose ps
# Stop (keeps the data):                            docker compose stop
#
# Ports are opened on 127.0.0.1 only: reachable from this machine, never from the network or the
# internet. On the VM they are reached through an SSH tunnel.
#
# Secrets (POSTGRES_PASSWORD, REDIS_PASSWORD) come from .env, which is git-ignored.
# Compose refuses to start if either is missing.

name: scam-mule

# Settings shared by all three services ("x-" blocks are reusable snippets).
x-shared: &shared
  restart: unless-stopped   # comes back after a VM reboot; not after `docker compose stop`
  oom_score_adj: 500        # if the VM runs out of memory, kill these first, not Bank Health
  cpu_shares: 512           # half the normal CPU priority: Bank Health wins when both are busy
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }   # logs can't fill the disk

services:
  kafka:
    # The event stream: Apache Kafka, one broker in KRaft mode (Kafka manages itself; no
    # ZooKeeper). ADR 0002. Official image, Intel and Arm builds (the Oracle VM is Arm).
    image: apache/kafka:4.4.0
    <<: *shared
    environment:
      # One process is both the broker (stores and serves events) and the controller (keeps
      # track of the cluster). Fine for a single-machine demo; a bank would run 3+ of each.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # A fixed, made-up cluster ID (not a secret) so the data folder is formatted the same way
      # every time.
      CLUSTER_ID: c2NhbS1tdWxlLWxhYjAwMQ
      # Three doors: INTERNAL for other containers, EXTERNAL for programs on this machine, and
      # CONTROLLER for Kafka's own housekeeping.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # With one broker, Kafka's internal topics can only have one copy each.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose (dev.payments, prod.payments ...), never by a typo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Keep a week of events for replays, but never more than 1 GB per partition (disk).
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      # Java heap fixed at 512 MB. The container cap below leaves about 1 GB more for Java's own
      # overhead and the file cache Kafka relies on.
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19092:19092"   # Kafka API for programs on this machine
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1536m
    memswap_limit: 1536m          # same as mem_limit = no swap
    cpus: 1.0
    healthcheck:
      # Healthy when the broker answers a real request. The check is itself a small Java program;
      # it gets its own 128 MB heap, or it would inherit the broker's 512 MB.
      # Each check costs a full CPU core for several seconds (Java starting up). Measured on the
      # PC, checking every 15 s averaged 38% of a core, so: every 5 s while starting (fast
      # `up --wait`), then once a minute.
      test:
        - CMD-SHELL
        - >-
          KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092 > /dev/null 2>&1
      start_period: 90s
      start_interval: 5s
      interval: 60s
      timeout: 20s
      retries: 3

  redis:
    # The live feature store ("first payment to this payee?", "third transfer in 10 minutes?").
    image: redis:8.8.4-alpine
    <<: *shared
    # Memory-only cache: live features are rebuilt from the event stream, so nothing is saved to
    # disk. When full, Redis drops the least recently used keys instead of failing.
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}   # lets the health check log in without printing it
    ports:
      - "127.0.0.1:16379:6379"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    # Alerts, cases, decisions, audit trail and website marts. ADR 0003.
    image: postgres:17.12-bookworm
    <<: *shared
    environment:
      POSTGRES_USER: scam_mule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: scam_mule   # prod's database; dev uses scam_mule_dev (common/environment.py)
    # Small-machine settings: a modest cache and few connections keep memory low.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=40
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  kafka-data:
  postgres-data:
